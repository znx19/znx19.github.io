projects:
  - title: "Trial Sourcing under Uncertainty about Match Quality"
    status: "Second-Year Paper (August 2026)"
    summary: "This paper documents that newly activated sourcing links in Colombian customs data start smaller, are more likely to be abandoned, and grow faster conditional on recording subsequent imports. It develops and calibrates a trial-sourcing model in which the first positive order reveals permanent source-product match quality."
    paper: "/files/trial-sourcing-match-quality.pdf"
