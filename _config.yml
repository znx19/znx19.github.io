# Site Settings
locale: "en-US"
title: "Ningxin's Homepage"
title_separator: "-"
name: "Ningxin Zhang"
description: "personal description"
url: "https://znx19.github.io"
baseurl: ""
repository: "znx19/znx19.github.io"
site_theme: "default"

# Author Information
author:
  avatar: "profile.png"
  name: "Ningxin Zhang"
  pronouns: "she/her"
  bio: "Prospective job market candidate in Macroeconomics (2029)"
  location: "Earth"
  employer: "University of Rochester"
  email: "nzhang27@ur.rochester.edu"
  github: "znx19"
  # googlescholar: "https://scholar.google.com/citations?user=PS_CX0AAAAAJ"
  # linkedin: ""
  # twitter: ""

# Collections (Content Types)
collections:
  posts:
    output: true
    permalink: /:collection/:path/
  courses: 
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: courses
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

# Navigation & UI settings
breadcrumbs: false
read_more: "disabled"
words_per_minute: 160
future: false

# Build Settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  math_engine: mathjax
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
encoding: "utf-8"

# Files to Include/Exclude
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README.md
  - tmp
  - vendor
keep_files:
  - .git
  - .svn

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-redirect-from
  - jemoji

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Sass
sass:
  sass_dir: _sass
  style: compressed
